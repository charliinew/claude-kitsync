name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Actions pinned to a commit: this job holds the signing key
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Never publish a release the test suite rejects
      - name: Run test suite
        run: bash test/run_tests.sh

      - name: Create release tarball
        run: |
          tar -czf claude-kitsync-${{ github.ref_name }}.tar.gz \
            bin/ lib/ keys/ kit/ templates/ completions/ VERSION README.md install.sh

      - name: Generate SHA256SUMS
        run: |
          sha256sum claude-kitsync-${{ github.ref_name }}.tar.gz install.sh > SHA256SUMS

      # Signing is mandatory: `claude-kitsync upgrade` refuses unsigned releases
      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY secret is missing — releases must be signed"
            exit 1
          fi
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Sign release artifacts
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --detach-sign --armor claude-kitsync-${{ github.ref_name }}.tar.gz
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --detach-sign --armor SHA256SUMS

      # Same check as upgrade: a throwaway keyring holding only the published key
      - name: Verify signature against keys/release-signing.asc
        run: |
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          gpg --batch --import keys/release-signing.asc
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS
          gpg --batch --verify claude-kitsync-${{ github.ref_name }}.tar.gz.asc claude-kitsync-${{ github.ref_name }}.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: |
            claude-kitsync-${{ github.ref_name }}.tar.gz
            claude-kitsync-${{ github.ref_name }}.tar.gz.asc
            install.sh
            SHA256SUMS
            SHA256SUMS.asc

      # Point the formula at the release tarball built above: its checksum is the
      # one published in SHA256SUMS, unlike GitHub's on-the-fly source archives
      - name: Compute SHA256 of release tarball for Homebrew
        id: sha256
        run: |
          TAG=${{ github.ref_name }}
          FILE="claude-kitsync-${TAG}.tar.gz"
          SHA=$(sha256sum "$FILE" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/charliinew/claude-kitsync/releases/download/${TAG}/${FILE}" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula on main
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ steps.sha256.outputs.sha256 }}
          URL: ${{ steps.sha256.outputs.url }}
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main

          sed -i "s|url \".*\"|url \"${URL}\"|" Formula/claude-kitsync.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA}\"|" Formula/claude-kitsync.rb

          git add Formula/claude-kitsync.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
          else
            git commit -m "chore(homebrew): update formula to ${TAG}"
            git push origin main
          fi
